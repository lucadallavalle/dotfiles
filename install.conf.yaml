- defaults:
    link:
      relink: true
      create: true

- clean: ["~"]

- link:
    # Shell stuff
    ~/.aliases: aliases
    ~/.exports: exports
    ~/.p10k.zsh: p10k.zsh
    ~/.path: path
    ~/.tmux.conf: tmux.conf
    ~/.zshrc: zshrc
    # Apps
    ~/.ssh-agent: ssh-agent
    ~/.config/environment.d/ssh-agent.conf: environment.d/ssh-agent.conf
    ~/.config/systemd/user/ssh-agent.service.d/lifetime.conf: systemd/user/ssh-agent.service.d/lifetime.conf
    ~/.thefuck: thefuck
    # Vim
    ~/.vimrc: vimrc
    ~/.ideavimrc: ideavimrc
    ~/.config/nvim: nvim
    # Desktop
    ~/.config/plasma-workspace: plasma-workspace

    ~/.config/topgrade.toml: topgrade.toml
    ~/.ng: ng
    ~/.fzf: fzf
    ~/.pnpm: pnpm
    ~/.config/lazygit/config.yml: lazygit.yml
    ~/.config/doom/: doom-emacs
    ~/.gitconfig: gitconfig

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - ["! command -v systemctl >/dev/null || systemctl --user enable --now ssh-agent.socket", Enabling ssh-agent]
